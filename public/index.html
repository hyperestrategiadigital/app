<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper</title>
  <meta name="theme-color" content="#4E2CA3" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="cabecalho">
    <div class="cabecalho-conteudo">
      <img src="img/logo-branco.png" alt="Hyper" />
      <span class="tagline">Tráfego pago</span>
    </div>
  </header>

  <main class="container">
    <p id="erro" class="erro" hidden></p>

    <section id="area-login">
      <h1>Bem-vindo à Hyper</h1>
      <p class="subtitulo">Entre para começar.</p>
      <button id="btn-entrar" class="destaque">Entrar com Google</button>
    </section>

    <section id="area-app" hidden>
      <div class="topo">
        <span>Olá, <strong id="nome-usuario"></strong></span>
        <button id="btn-sair" class="secundario">Sair</button>
      </div>

      <form id="form-nota">
        <input id="texto-nota" type="text" placeholder="Escreva uma nota..." autocomplete="off" />
        <button type="submit">Salvar</button>
      </form>

      <ul id="lista-notas"></ul>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
