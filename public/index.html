<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hyper</title>
  <meta name="theme-color" content="#4E2CA3" />
  <link rel="icon" type="image/png" href="img/favicon.png" />
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Hyper" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@1,700;1,800&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <!-- Tela de login -->
  <section id="tela-login">
    <div class="login-caixa">
      <img src="img/logo-branco.png" alt="Hyper" class="login-logo" />
      <p class="tagline">Tráfego pago</p>
      <h1>Central de trabalho</h1>
      <p>Tarefas, clientes, conteúdo, tráfego e financeiro num lugar só.</p>
      <button id="btn-entrar" class="destaque">Entrar com Google</button>
    </div>
  </section>

  <!-- App -->
  <div id="app">
    <aside class="lateral-menu">
      <div class="marca">
        <img src="img/logo-branco.png" alt="Hyper" />
      </div>
      <nav id="menu" aria-label="Menu principal"></nav>
      <div class="usuario">
        <div id="menu-usuario" class="menu-usuario" hidden>
          <a href="#/conta">Minha conta</a>
          <a href="#/conta">Conexões (Google Agenda)</a>
          <button id="btn-sair" type="button">Sair</button>
        </div>
        <button id="btn-usuario" class="btn-usuario" type="button" aria-haspopup="true" aria-expanded="false"></button>
      </div>
    </aside>
    <div class="principal">
      <header class="barra-movel">
        <button id="btn-menu" class="icone" aria-label="Abrir menu">☰</button>
        <img src="img/logo-branco.png" alt="Hyper" />
        <button id="btn-busca-movel" class="icone busca-movel" aria-label="Buscar">⌕</button>
      </header>
      <nav id="nav-movel" class="nav-movel" aria-label="Atalhos"></nav>
      <main id="conteudo" tabindex="-1">
        <p class="carregando-msg">Carregando seus dados...</p>
      </main>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
