name: Testar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    name: Testes (regras do Firestore e telas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # O emulador do Firestore precisa de Java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Instalar dependências dos testes
        run: npm install --no-audit --no-fund
      - name: Instalar o navegador dos testes
        run: npx playwright install --with-deps chromium
      - name: Regras do Firestore (emulador)
        run: npm run test:regras
      - name: Telas
        run: npm run test:telas
      - name: Relatório das telas (se falhar)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-telas
          path: test-results/
          retention-days: 7

  deploy:
    name: Publicar no Firebase
    needs: testes
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Credenciais do Firebase
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "$RUNNER_TEMP/sa.json"
      - name: Publicar site
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@latest deploy --only hosting --project hyper-9e023 --non-interactive
      # As regras do Firestore vão junto. A conta de serviço precisa do papel "Administrador do Firebase Rules"
      # (ou "Editor do Firebase"); sem ele este passo falha, o site continua publicado e as regras ficam como estavam.
      - name: Publicar regras do Firestore
        continue-on-error: true
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx -y firebase-tools@latest deploy --only firestore:rules --project hyper-9e023 --non-interactive
